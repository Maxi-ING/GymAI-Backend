services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym_local
      POSTGRES_DB: gym
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gym_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d gym"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  gym_data:
